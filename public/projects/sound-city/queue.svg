  </g>
  <rect x="44" y="423" width="238" height="62" fill="#ffb000"/><text x="76" y="463" fill="#08090b" font-family="monospace" font-size="18" font-weight="700" letter-spacing="3">ACCEPT CHANGE</text>
  <rect x="300" y="423" width="220" height="62" fill="none" stroke="#97949a"/><text x="340" y="463" fill="#f1eee8" font-family="monospace" font-size="18" letter-spacing="3">REJECT</text>
</svg>
